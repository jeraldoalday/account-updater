name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails the build on high/critical vulnerabilities in production
      # dependencies specifically (not devDependencies, which pull in
      # build-tool-only advisories - e.g. a vite/esbuild dev-server issue -
      # that never ship or run in production).
      - run: npm audit --omit=dev --audit-level=high
